name: AskLive CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 1. CI - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build Backend
        run: |
          chmod +x gradlew
          ./gradlew clean compileJava --no-daemon

      - if: success()
        run: ./gradlew bootJar -x test --no-daemon

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-spring-jar
          path: build/libs/*.jar

  github-release:
    name: 2. Create GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: ./release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: ./release/*.jar
          draft: false
          prerelease: false

  deploy-to-vps:
    name: 3. CD - Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: build/libs/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/sj0rs1/asklive-api:${{ github.run_number }}

      - name: Connect to Fontys Netlab OpenVPN
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASSWORD }}" >> vpn-auth.txt
          echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn
          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt --daemon
          sleep 10
          rm -f vpn-auth.txt

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/sj0rs1/asklive-api:${{ github.run_number }}
            docker stop asklive_api || true
            docker rm asklive_api || true
            docker run -d --name asklive_api \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://172.17.0.1:3306/${{ secrets.MYSQL_DATABASE }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.MYSQL_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              ghcr.io/sj0rs1/asklive-api:${{ github.run_number }}
            docker image prune -f