name: AskLive CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 1. CI - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build Backend
        run: |
          chmod +x gradlew
          ./gradlew clean compileJava --no-daemon

      - if: success()
        run: ./gradlew bootJar -x test --no-daemon

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-spring-jar
          path: build/libs/*.jar

  github-release:
    name: 2. Create GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: ./release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: ./release/*.jar
          draft: false
          prerelease: false

  deploy-to-vps:
    name: 3. CD - Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: build/libs/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/sj0rs1/asklive-api:${{ github.run_number }}

      - name: Connect to Fontys Netlab OpenVPN 
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASSWORD }}" >> vpn-auth.txt
          echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn
          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt --daemon
          sleep 10
          rm -f vpn-auth.txt

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/sj0rs1/asklive-api:${{ github.run_number }}
            docker network create asklive_network 2>/dev/null || true

            # Start MySQL only if it isn't already running (data lives in the mysql_data volume)
            if ! docker ps --format '{{.Names}}' | grep -qx asklive_mysql; then
              docker rm -f asklive_mysql 2>/dev/null || true
              docker run -d --name asklive_mysql --network asklive_network \
                --restart unless-stopped \
                -e MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
                -e MYSQL_DATABASE='${{ secrets.MYSQL_DATABASE }}' \
                -e MYSQL_USER='${{ secrets.MYSQL_USER }}' \
                -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD }}' \
                -v mysql_data:/var/lib/mysql \
                mysql:8.4
            fi

            # Wait for MySQL (max ~2 min)
            ready=false
            for i in $(seq 1 60); do
              if docker exec asklive_mysql mysqladmin ping -h 127.0.0.1 -uroot -p'${{ secrets.MYSQL_ROOT_PASSWORD }}' --silent 2>/dev/null; then
                ready=true; echo "MySQL ready"; break
              fi
              echo "Waiting for MySQL... ($i)"; sleep 2
            done
            if [ "$ready" != "true" ]; then
              docker logs --tail 50 asklive_mysql
              exit 1
            fi

            docker rm -f asklive_api 2>/dev/null || true
            docker run -d --name asklive_api --network asklive_network \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://asklive_mysql:3306/${{ secrets.MYSQL_DATABASE }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.MYSQL_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              -e SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=90000 \
              ghcr.io/sj0rs1/asklive-api:${{ github.run_number }}

            # Fail the pipeline if the API crashed, and print why
            sleep 30
            if [ "$(docker inspect -f '{{.State.Running}}' asklive_api)" != "true" ]; then
              docker logs --tail 100 asklive_api
              exit 1
            fi

            docker image prune -f