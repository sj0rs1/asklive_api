name: Asklive CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@4 # gets code from repository

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # JDK vendor
          java-version: '25'
          cache: 'gradle'

      - name: Fix gradlew permission
        run: chmod +x gradlew # adds the executable permission to a file

      - name: Build API
        run: ./gradlew bootJar --no-daemon # compile main sources only, no tests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-backend-jar # name for artifact
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1 # gets uploaded as release later

  github-release:
    name: Create GitHub Release
    needs: build-and-test # makes sure build-and-test succeeded
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-backend-jar # artifact name defined earlier
          path: ./release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2 # https://github.com/softprops/action-gh-release
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: ./release/*.jar

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: build/libs/

      - name: Install OpenVPN # updates system & installs openvpn
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Write VPN config # writes out OPENVPN_CONFIG secret to a file so it can be used to authenticate
        run: echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3 # https://github.com/kota65535/github-openvpn-connect-action
        with:
          config_file: client.ovpn
          username: ${{ secrets.OPENVPN_USER }}
          password: ${{ secrets.OPENVPN_PASSWORD }}

      - name: Upload files and deploy
        uses: appleboy/scp-action@v0.1.7 # Secure Copy Protocol, https://github.com/appleboy/scp-action
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "build/libs/*.jar,Dockerfile,deploy.sh" # copies these files over to the target
          target: /home/sjors/asklive_api # location of project on the vps

      - name: Restart API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: bash ~/asklive/deploy.sh # runs deploy.sh to update the version running on the vps

  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # sonar needs full history for blame and new-code detection

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar